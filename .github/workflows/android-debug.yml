name: ARM64 native npm build fix

on:
  push:
    branches:
      - fix/native-npm-builds-arm64
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download checksum-pinned shared runtime asset
        run: |
          mkdir -p dist/runtime-bundles
          curl --fail --location --retry 3 \
            "https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4/pocketdev-agy-arm64-2026.09.1.tar.zst" \
            --output dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst
          echo "a659ab9188956fc4721ca86fb21b5118e0e489f47a5e02ae6b4f2fb423659d78  dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst" | sha256sum --check

      - name: Run unit tests and build Online debug APK
        run: ./gradlew --no-daemon :app:testOnlineDebugUnitTest :app:assembleOnlineDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 14
