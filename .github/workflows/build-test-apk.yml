name: Build test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/claude-subscription-oauth-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: |
          chmod +x ./gradlew
          ./gradlew testOnlineDebugUnitTest lintOnlineDebug assembleOnlineDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-claude-oauth-fix-online
          path: app/build/outputs/apk/online/debug/app-online-debug.apk
          if-no-files-found: error
          retention-days: 7
