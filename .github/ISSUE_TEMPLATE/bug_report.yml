name: Bug report
about: Create a report to help us improve Mobile Harness.
title: ""
labels: bug
assignees: ""
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the bug and how it occurred.
      placeholder: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include device details and Android version.
      placeholder: Android version, device model, architecture, app version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Clear steps to reproduce the issue.
      placeholder: 1. Open the app\n2. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Add logs, screenshots, or relevant output.
    validations:
      required: false
