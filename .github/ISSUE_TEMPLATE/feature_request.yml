name: Feature request
about: Suggest an idea or enhancement for Mobile Harness.
title: ""
labels: enhancement
assignees: ""
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: Describe the workflow gap or limitation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: Describe your idea or desired behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why this matters
      description: Explain the value for developers and users.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Any alternative approaches or workarounds?
    validations:
      required: false
