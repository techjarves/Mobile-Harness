AutoName: Mobile Harness
Summary: Autonomous AI Coding Agent & Full Linux Development Environment on Android
Description: |-
  Mobile Harness brings a full-stack, local AI software engineering environment
  directly to your Android device.

  By combining an embedded ARM64 Ubuntu PRoot Linux runtime with autonomous
  coding agents (Claude Code, OpenAI, OpenRouter, and custom LLM providers),
  Mobile Harness allows you to code, build, test, and run real projects on your
  phone—without needing Termux, root access, or remote server dependencies.

